
name: Student Management CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Run security scan
        run: bandit -r student.py

      - name: Run unit tests
        run: python -m unittest discover -v
